[package]
name = "email-os"
version = "0.1.0"
description = "Tauri 2 adapter over the fixture and opt-in Gmail mailbox-action cores"
edition = "2021"
rust-version = "1.89"

[lib]
name = "email_os"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mail-core = { path = "../crates/mail-core" }
tauri = { version = "2.3", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Android link dispatch (ADR 0006 decision 13): the same jni version tauri and
# wry use, so the lockfile gains no package.
[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"

[dev-dependencies]
tempfile = "3"
mail-core = { path = "../crates/mail-core", features = ["test-support"] }

[features]
# `tauri build` enables this; plain `cargo run`/`cargo check` stay in dev mode.
custom-protocol = ["tauri/custom-protocol"]
