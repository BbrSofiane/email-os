name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned mise and project tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: "2026.11.3"
          cache: false

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          # The action defaults include the retired SDK package `tools`.
          packages: platform-tools

      - name: Install pinned Android platform, build tools, and NDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install locked UI dependencies
        run: mise run install:ui

      - name: Build fixture APK
        run: mise run android:build

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: email-os-android-fixture-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error


  android-release-proof:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ANDROID_VERSION_CODE: "1001"
      ANDROID_KEYSTORE_PASSWORD: throwaway-password
      ANDROID_KEY_PASSWORD: throwaway-password
      ANDROID_KEY_ALIAS: proof
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/src-tauri/gen/android/app/build/proof.p12
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: "2026.11.3"
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: mise run install:ui
      - name: Generate throwaway signer
        run: |
          mkdir -p "$(dirname "$ANDROID_KEYSTORE_PATH")"
          keytool -genkeypair -storetype PKCS12 -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -alias "$ANDROID_KEY_ALIAS" -dname 'CN=CI proof' -keyalg RSA -validity 1
      - run: mise run android:release
      - name: Verify release
        run: |
          cert=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | sed -n 's/.*SHA256: //p')
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -name '*universal*release*.apk')
          test "${#apks[@]}" -eq 1
          scripts/android/verify-release.sh "${apks[0]}" "$version" "$ANDROID_VERSION_CODE" "$cert"

  check:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned mise and project tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: "2026.11.3"
          # Rustup lives outside mise's tool cache. Install it fresh on each runner.
          cache: false

      - name: Find pnpm store
        id: pnpm-store
        run: echo "path=$(mise exec -- pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo and pnpm data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-deps-${{ hashFiles('Cargo.lock', 'pnpm-lock.yaml', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install Linux native prerequisites
        run: mise run setup:linux

      - name: Install locked UI dependencies
        run: mise run install:ui

      - name: Run full CI gate
        run: mise run check:all
