[tools]
node = "24.4.1"
pnpm = "10.18.0"
rust = { version = "1.89.0", profile = "minimal", components = "rustfmt,clippy" }

[tasks."setup:linux"]
description = "Install Debian/Ubuntu VM prerequisites for native builds and screenshots (uses apt-get)"
run = '''
set -eu
if [ "$(uname -s)" != Linux ]; then
  echo "setup:linux requires Linux with apt-get (Debian/Ubuntu); macOS setup is unchanged." >&2
  exit 1
fi
if ! command -v apt-get >/dev/null 2>&1; then
  echo "setup:linux requires apt-get. Install the prerequisites for your distribution manually; see docs/development.md." >&2
  exit 1
fi
set -- apt-get
if [ "$(id -u)" != 0 ]; then
  if ! command -v sudo >/dev/null 2>&1; then
    echo "setup:linux requires root or sudo to install OS packages." >&2
    exit 1
  fi
  set -- sudo apt-get
fi
"$@" update
"$@" install -y build-essential pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev dbus-daemon xvfb xauth xdotool openbox x11-utils scrot
'''

[tasks."install:ui"]
description = "Install locked frontend dependencies"
run = "pnpm install --frozen-lockfile"

[tasks."test:core"]
description = "Test the headless mail core"
run = "cargo test --locked -p mail-core"

[tasks."gen:ts"]
description = "Generate src/lib/ipc/generated.ts from the Rust DTOs"
run = "cargo run --locked -q -p mail-core --bin generate-types -- src/lib/ipc/generated.ts"

[tasks."check:contract"]
description = "Fail when src/lib/ipc/generated.ts drifts from the Rust DTOs"
run = """
dir=$(mktemp -d)
tmp="$dir/generated.ts"
trap 'rm -f "$tmp"; rmdir "$dir"' EXIT
cargo run --locked -q -p mail-core --bin generate-types -- "$tmp"
diff -u src/lib/ipc/generated.ts "$tmp"
"""

[tasks."lint:core"]
description = "Workspace formatting and mail-core clippy checks with warnings denied"
run = "cargo fmt --all -- --check && cargo clippy --locked -p mail-core --all-targets -- -D warnings"

[tasks."lint:native"]
description = "Clippy checks for the native shell and all targets with warnings denied (needs GTK/WebKit dev prerequisites)"
run = "cargo clippy --locked -p email-os --all-targets -- -D warnings"

[tasks."test:ui"]
description = "Run frontend component and contract tests"
run = "pnpm test"

[tasks.typecheck]
description = "Typecheck the Vue frontend"
run = "pnpm typecheck"

[tasks."build:web"]
description = "Build the frontend assets for browser preview and native shell"
run = "pnpm build"

[tasks."dev:web"]
description = "Run the synthetic in-memory browser preview"
run = "pnpm dev"

[tasks."dev:native"]
description = "Run the native shell (synthetic fixture default; Gmail starts read-only until mailbox actions are enabled)"
run = "pnpm tauri dev"

[tasks."build:native"]
description = "Build the native shell bundle for fixture and Gmail profiles (needs native prerequisites)"
run = "pnpm tauri build"

[tasks."android:doctor"]
description = "Check pinned Android build prerequisites"
run = '''
set -eu
ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
NDK_HOME="${NDK_HOME:-$ANDROID_HOME/ndk/27.2.12479018}"
export ANDROID_HOME ANDROID_SDK_ROOT NDK_HOME
JAVA="${JAVA_HOME:+$JAVA_HOME/bin/}java"
for tool in java javac rustup cargo pnpm; do
  command -v "$tool" >/dev/null || { echo "Missing required tool: $tool" >&2; exit 1; }
done
test -d "$ANDROID_HOME/platforms/android-35" || { echo "Missing Android platform 35" >&2; exit 1; }
test -d "$ANDROID_HOME/build-tools/35.0.0" || { echo "Missing Android build-tools 35.0.0" >&2; exit 1; }
test -x "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" || { echo "Missing NDK 27.2.12479018 at $NDK_HOME" >&2; exit 1; }
rustup target list --installed | rg -q '^aarch64-linux-android$' || { echo "Missing Rust target aarch64-linux-android (run rustup target add aarch64-linux-android x86_64-linux-android)" >&2; exit 1; }
rustup target list --installed | rg -q '^x86_64-linux-android$' || { echo "Missing Rust target x86_64-linux-android (run rustup target add aarch64-linux-android x86_64-linux-android)" >&2; exit 1; }
"$JAVA" -version 2>&1 | rg -q '17\.' || { echo "JDK 17 is required" >&2; exit 1; }
echo "Android toolchain ready: API 35, build-tools 35.0.0, NDK 27.2.12479018, JDK 17, ARM64 + x86_64 targets"
'''

[tasks."android:build"]
description = "Build a debug APK with bundled frontend for ARM64 and x86_64"
depends = ["android:doctor"]
run = '''
export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
export NDK_HOME="${NDK_HOME:-$ANDROID_HOME/ndk/27.2.12479018}"
pnpm tauri android build --debug --apk --target aarch64 x86_64 --config src-tauri/tauri.android.conf.json --ci
'''

[tasks."android:dev"]
description = "Run the Android fixture app on an attached device or emulator"
depends = ["android:doctor"]
run = '''
export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
export NDK_HOME="${NDK_HOME:-$ANDROID_HOME/ndk/27.2.12479018}"
pnpm tauri android dev --config src-tauri/tauri.android.conf.json
'''

[tasks."check:native"]
description = "Type-check the native shell and all targets (needs GTK/WebKit dev prerequisites; see docs/development.md)"
run = "cargo check --locked -p email-os --all-targets"

[tasks."test:native"]
description = "Test the native command/event bridge (needs native prerequisites)"
run = "cargo test --locked -p email-os"

[tasks.check]
description = "Validate core, contract generation, frontend tests and types (no native prerequisites needed)"
run = "mise run test:core && mise run check:contract && mise run lint:core && mise run test:ui && mise run typecheck"

[tasks."check:all"]
description = "Run the full check, native lint and bridge tests, and web production build sequentially (native prerequisites required)"
run = "mise run check && mise run lint:native && mise run test:native && mise run build:web"

[tasks."test:rendered"]
description = "Run opt-in rendered browser regressions with an explicit Chrome/Chromium binary"
run = '''
if [ -z "${EMAIL_OS_RENDERED_LAYOUT_CHROME:-}" ]; then
  echo "EMAIL_OS_RENDERED_LAYOUT_CHROME is required (path to Chrome or Chromium)." >&2
  echo "Set it, then run: mise run test:rendered" >&2
  exit 1
fi
if ! command -v "$EMAIL_OS_RENDERED_LAYOUT_CHROME" >/dev/null 2>&1 && [ ! -x "$EMAIL_OS_RENDERED_LAYOUT_CHROME" ]; then
  echo "Chrome/Chromium binary not found or not executable: $EMAIL_OS_RENDERED_LAYOUT_CHROME" >&2
  exit 1
fi
EMAIL_OS_RUN_RENDERED=1 pnpm vitest run --config vitest.config.ts tests/reader/reader.rendered.test.ts tests/discovery/discovery.rendered.test.ts tests/layout/disclosure-focus.rendered.test.ts tests/browsing/inbox-list.rendered-layout.test.ts
'''
