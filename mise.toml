[tools]
node = "24.4.1"
pnpm = "10.18.0"
rust = "1.89.0"

[tasks."setup:linux"]
description = "Install Debian/Ubuntu VM prerequisites for native builds and screenshots (uses apt-get)"
run = '''
set -eu
if [ "$(uname -s)" != Linux ]; then
  echo "setup:linux requires Linux with apt-get (Debian/Ubuntu); macOS setup is unchanged." >&2
  exit 1
fi
if ! command -v apt-get >/dev/null 2>&1; then
  echo "setup:linux requires apt-get. Install the prerequisites for your distribution manually; see docs/development.md." >&2
  exit 1
fi
set -- apt-get
if [ "$(id -u)" != 0 ]; then
  if ! command -v sudo >/dev/null 2>&1; then
    echo "setup:linux requires root or sudo to install OS packages." >&2
    exit 1
  fi
  set -- sudo apt-get
fi
"$@" update
"$@" install -y build-essential pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev dbus-daemon xvfb xauth xdotool openbox x11-utils scrot
'''

[tasks."install:ui"]
description = "Install locked frontend dependencies"
run = "pnpm install --frozen-lockfile"

[tasks."test:core"]
description = "Test the headless mail core"
run = "cargo test --locked -p mail-core"

[tasks."gen:ts"]
description = "Generate src/lib/ipc/generated.ts from the Rust DTOs"
run = "cargo run --locked -q -p mail-core --bin generate-types -- src/lib/ipc/generated.ts"

[tasks."check:contract"]
description = "Fail when src/lib/ipc/generated.ts drifts from the Rust DTOs"
run = """
dir=$(mktemp -d)
tmp="$dir/generated.ts"
trap 'rm -f "$tmp"; rmdir "$dir"' EXIT
cargo run --locked -q -p mail-core --bin generate-types -- "$tmp"
diff -u src/lib/ipc/generated.ts "$tmp"
"""

[tasks."lint:core"]
description = "Workspace formatting and headless core clippy checks"
run = "cargo fmt --all -- --check && cargo clippy --locked -p mail-core --all-targets -- -D warnings"

[tasks."test:ui"]
description = "Run frontend component and contract tests"
run = "pnpm test"

[tasks.typecheck]
description = "Typecheck the Vue frontend"
run = "pnpm typecheck"

[tasks."build:web"]
description = "Build the frontend assets for browser preview and native shell"
run = "pnpm build"

[tasks."dev:web"]
description = "Run the fixture-only browser preview"
run = "pnpm dev"

[tasks."dev:native"]
description = "Run the native shell (fixture default; EMAIL_OS_MODE=gmail opts into read-only Gmail)"
run = "pnpm tauri dev"

[tasks."build:native"]
description = "Build the native fixture shell bundle (needs native prerequisites)"
run = "pnpm tauri build"

[tasks."check:native"]
description = "Type-check the native shell (needs GTK/WebKit dev prerequisites; see docs/development.md)"
run = "cargo check --locked -p email-os --all-targets"

[tasks."test:native"]
description = "Test the native command/event bridge (needs native prerequisites)"
run = "cargo test --locked -p email-os"

[tasks.check]
description = "Validate core, contract generation, frontend tests and types (no native prerequisites needed)"
depends = ["test:core", "check:contract", "lint:core", "test:ui", "typecheck"]

[tasks."test:rendered"]
description = "Run opt-in rendered browser regressions with an explicit Chrome/Chromium binary"
run = '''
if [ -z "${EMAIL_OS_RENDERED_LAYOUT_CHROME:-}" ]; then
  echo "EMAIL_OS_RENDERED_LAYOUT_CHROME is required (path to Chrome or Chromium)." >&2
  echo "Set it, then run: mise run test:rendered" >&2
  exit 1
fi
if ! command -v "$EMAIL_OS_RENDERED_LAYOUT_CHROME" >/dev/null 2>&1 && [ ! -x "$EMAIL_OS_RENDERED_LAYOUT_CHROME" ]; then
  echo "Chrome/Chromium binary not found or not executable: $EMAIL_OS_RENDERED_LAYOUT_CHROME" >&2
  exit 1
fi
EMAIL_OS_RUN_RENDERED=1 pnpm vitest run --config vitest.config.ts tests/reader.rendered.test.ts tests/discovery.rendered.test.ts tests/disclosure-focus.rendered.test.ts tests/inbox-list.rendered-layout.test.ts
'''
