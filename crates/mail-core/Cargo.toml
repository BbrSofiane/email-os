[package]
name = "mail-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Headless fixture mail core: concrete SQLite store, seed-once synthetic inbox, serial cancellable archive worker, serde/ts-rs DTOs"
license = "UNLICENSED"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "11", features = ["serde-compat", "no-serde-warnings"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
url = "2"
mailparse = "0.16"
webbrowser = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[[bin]]
name = "generate-types"
path = "src/bin/generate-types.rs"
