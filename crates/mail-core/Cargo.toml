[package]
name = "mail-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Headless fixture mail core: concrete SQLite store, seed-once synthetic inbox, serial cancellable archive worker, serde/ts-rs DTOs"
license = "UNLICENSED"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "11", features = ["serde-compat", "no-serde-warnings"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[[bin]]
name = "generate-types"
path = "src/bin/generate-types.rs"
